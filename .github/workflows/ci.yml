name: Test and deploy locally

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-central-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Unit, configuration and infrastructure contract tests
        run: make check
      - name: Start LocalStack (no account or paid features)
        run: make up
      - name: Deploy both services
        run: make deploy
      - name: Test real HTTP endpoints
        run: make smoke
      - name: Verify converged infrastructure
        run: make plan
      - name: Failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          docker compose logs --no-color --tail=100
          make logs SERVICE=length
          make logs SERVICE=json-validator
      - name: Destroy even after failures
        if: always()
        run: make destroy
      - name: Stop LocalStack even if destroy fails
        if: always()
        run: make down
