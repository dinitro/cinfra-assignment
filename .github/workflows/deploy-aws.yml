name: Deploy to AWS

# Manual-only: this was never run against a real AWS account (see docs/aws.md), and an
# automatic push trigger would fail every push to main since no sandbox account/vars exist.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: aws-sandbox
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_name_prefix: ${{ vars.AWS_NAME_PREFIX }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Init with the S3 backend
        run: |
          # backend.tf is gitignored (kept out of git like terraform.tfvars); it has no
          # account-specific content, so CI materializes the same committed example verbatim.
          cp infra/aws/backend.tf.example infra/aws/backend.tf
          terraform -chdir=infra/aws init -input=false \
            -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - name: Plan
        run: terraform -chdir=infra/aws plan -input=false -out=deploy.tfplan
      - name: Apply
        run: terraform -chdir=infra/aws apply -input=false deploy.tfplan
      - name: Service URLs
        run: |
          echo '### Deployed service URLs' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=infra/aws output -json service_urls >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
