name: cinfra
services:
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: iam,lambda,logs,sts
      AWS_DEFAULT_REGION: eu-central-1
      LAMBDA_DOCKER_NETWORK: cinfra_default
    volumes:
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
